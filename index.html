<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خريطة البقاع | Bekaa Valley Map</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    :root {
      --bg: #f8f5ee;
      --paper: #fffdf8;
      --line: #e1d8c4;
      --text: #2f2a1f;
      --muted: #7f735f;
      --accent: #ce6c27;
      --accent-soft: #f5dcc7;
      --sea: #2f7b90;
      --radius: 18px;
      --shadow: 0 14px 34px rgba(101, 70, 33, 0.12);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      font-family: "Tajawal", sans-serif;
      background:
        radial-gradient(1100px 420px at 14% -10%, #f7e8c8 0%, transparent 58%),
        radial-gradient(1000px 500px at 89% 12%, #d7edf2 0%, transparent 62%),
        linear-gradient(140deg, #fbf8f2 0%, #f5efe4 100%);
      animation: fade-in 450ms ease-out;
    }

    .shell {
      width: min(1180px, 96vw);
      margin: 1.2rem auto;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 1rem;
    }

    header {
      background: linear-gradient(130deg, #fffaf0 0%, #f3ede2 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      animation: rise 500ms ease-out;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .badge {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(150deg, #ffd39b 0%, #f1b06f 100%);
      box-shadow: 0 10px 22px rgba(206, 108, 39, 0.26);
      font-size: 1.25rem;
    }

    h1 {
      font-size: clamp(1.15rem, 2.2vw, 1.5rem);
      font-weight: 700;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 0.82rem;
      color: var(--muted);
      font-family: "Space Mono", monospace;
      direction: ltr;
      text-align: left;
      margin-top: 0.2rem;
    }

    .pill {
      border: 1px solid #d8ccb5;
      background: #fffbf2;
      color: #8d6a45;
      border-radius: 999px;
      padding: 0.35rem 0.8rem;
      font-family: "Space Mono", monospace;
      font-size: 0.74rem;
      white-space: nowrap;
    }

    main {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1rem;
      min-height: 76vh;
    }

    aside,
    .map-frame {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    aside {
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .aside-head {
      padding: 1rem 1rem 0.55rem;
      border-bottom: 1px solid var(--line);
      font-family: "Space Mono", monospace;
      font-size: 0.76rem;
      color: var(--muted);
      direction: ltr;
      text-align: left;
      letter-spacing: 0.08em;
    }

    .count {
      margin: 0.9rem 1rem;
      padding: 0.55rem 0.75rem;
      border-radius: 10px;
      border: 1px solid #e6c8ad;
      background: var(--accent-soft);
      color: #8a4d1e;
      font-family: "Space Mono", monospace;
      font-size: 0.78rem;
      direction: ltr;
      text-align: center;
    }

    .location-list {
      list-style: none;
      overflow-y: auto;
      padding: 0.35rem 0;
      scrollbar-width: thin;
      scrollbar-color: #d4cab8 transparent;
    }

    .location-list li {
      border-bottom: 1px solid #f3eee3;
    }

    .location-btn {
      width: 100%;
      border: none;
      text-align: right;
      padding: 0.62rem 0.95rem;
      background: transparent;
      font: inherit;
      color: inherit;
      cursor: pointer;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.65rem;
      align-items: center;
      transition: background-color 180ms ease, transform 180ms ease;
      animation: list-pop 360ms ease both;
    }

    .location-btn:hover {
      background: #fff4e8;
      transform: translateX(-2px);
    }

    .location-btn.is-active {
      background: #feecd9;
      box-shadow: inset 3px 0 0 #cb6a25;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(206, 108, 39, 0.14);
      margin-top: 0.2rem;
    }

    .ar-name {
      display: block;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .en-name {
      display: block;
      font-size: 0.7rem;
      color: var(--muted);
      font-family: "Space Mono", monospace;
      direction: ltr;
      text-align: left;
      margin-top: 0.08rem;
    }

    .map-frame {
      position: relative;
      min-height: 510px;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .custom-pin {
      width: 16px;
      height: 16px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      background: #d16f2a;
      border: 2px solid #fff7eb;
      box-shadow: 0 4px 10px rgba(148, 87, 44, 0.4);
      position: relative;
    }

    .custom-pin::after {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff5e5;
      position: absolute;
      top: 3px;
      left: 3px;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      border: 1px solid #eadcc7;
      box-shadow: 0 14px 30px rgba(127, 98, 66, 0.2);
    }

    .popup-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.15rem;
      direction: rtl;
      text-align: right;
    }

    .popup-sub {
      font-size: 0.75rem;
      color: #6f6658;
      font-family: "Space Mono", monospace;
      margin-bottom: 0.15rem;
      direction: ltr;
      text-align: left;
    }

    .popup-coord {
      font-size: 0.72rem;
      color: #8a7f6f;
      font-family: "Space Mono", monospace;
      direction: ltr;
      text-align: left;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes list-pop {
      from {
        opacity: 0;
        transform: translateX(8px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @media (max-width: 980px) {
      .shell {
        width: 95vw;
      }

      main {
        grid-template-columns: 1fr;
      }

      aside {
        order: 2;
        max-height: 300px;
      }

      .map-frame {
        order: 1;
        min-height: 56vh;
      }
    }

    @media (max-width: 640px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .pill {
        align-self: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="title-wrap">
        <div class="badge" aria-hidden="true">🗺</div>
        <div>
          <h1>خريطة البقاع - Bekaa Valley Map</h1>
          <p class="subtitle">Lebanon · Interactive Bekaa Locations</p>
        </div>
      </div>
      <div class="pill" id="pill-count">17 locations</div>
    </header>

    <main>
      <aside>
        <div class="aside-head">Locations</div>
        <div class="count" id="side-count">17 مناطق محددة</div>
        <ul class="location-list" id="location-list"></ul>
      </aside>

      <section class="map-frame">
        <div id="map" role="application" aria-label="Bekaa valley map"></div>
      </section>
    </main>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    const LOCATIONS = [
      { name: "تمنين", ar: "Tamnine", lat: 33.872, lon: 36.006 },
      { name: "تربل", ar: "Tarboul", lat: 33.830, lon: 36.062 },
      { name: "رياق", ar: "Riyaq", lat: 33.896, lon: 36.044 },
      { name: "كفرذبد", ar: "Kfar Zabad", lat: 33.747, lon: 35.877 },
      { name: "فرزل", ar: "Ferzol", lat: 33.837, lon: 35.972 },
      { name: "نيحا", ar: "Niha", lat: 33.578, lon: 35.771 },
      { name: "ابلح", ar: "Ablah", lat: 33.832, lon: 35.962 },
      { name: "زحلة", ar: "Zahle", lat: 33.847, lon: 35.902 },
      { name: "معلقة", ar: "Maalaka", lat: 33.855, lon: 35.898 },
      { name: "مجدل عنجر", ar: "Majdel Anjar", lat: 33.724, lon: 35.929 },
      { name: "عنجر", ar: "Anjar", lat: 33.726, lon: 35.936 },
      { name: "المرج", ar: "Al Marj", lat: 33.698, lon: 35.952 },
      { name: "برالياس", ar: "Bar Elias", lat: 33.770, lon: 35.873 },
      { name: "قب الياس", ar: "Qab Elias", lat: 33.793, lon: 35.842 },
      { name: "منصورة", ar: "Mansourieh", lat: 33.754, lon: 35.921 },
      { name: "قرعون", ar: "Qaraoun", lat: 33.553, lon: 35.688 },
      { name: "راشيا", ar: "Rashaya", lat: 33.500, lon: 35.838 }
    ];

    const map = L.map("map", {
      center: [33.75, 35.90],
      zoom: 10,
      zoomControl: true,
      scrollWheelZoom: true
    });

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
      maxZoom: 19
    }).addTo(map);

    const pinIcon = L.divIcon({
      className: "",
      html: '<div class="custom-pin"></div>',
      iconSize: [16, 16],
      iconAnchor: [8, 16],
      popupAnchor: [0, -14]
    });

    const locationList = document.getElementById("location-list");
    const sideCount = document.getElementById("side-count");
    const pillCount = document.getElementById("pill-count");

    sideCount.textContent = `${LOCATIONS.length} مناطق محددة`;
    pillCount.textContent = `${LOCATIONS.length} locations`;

    const markers = [];
    const itemButtons = [];
    const bounds = L.latLngBounds();

    function activateItem(index) {
      itemButtons.forEach((button, idx) => {
        button.classList.toggle("is-active", idx === index);
      });
    }

    LOCATIONS.forEach((loc, index) => {
      const marker = L.marker([loc.lat, loc.lon], { icon: pinIcon }).addTo(map);

      marker.bindPopup(`
        <div>
          <div class="popup-title">${loc.name}</div>
          <div class="popup-sub">${loc.ar}</div>
          <div class="popup-coord">${loc.lat.toFixed(4)}, ${loc.lon.toFixed(4)}</div>
        </div>
      `);

      marker.on("click", () => activateItem(index));
      markers.push(marker);
      bounds.extend([loc.lat, loc.lon]);

      const listItem = document.createElement("li");
      const button = document.createElement("button");
      button.className = "location-btn";
      button.style.animationDelay = `${index * 35}ms`;
      button.type = "button";
      button.setAttribute("aria-label", `إظهار ${loc.name} على الخريطة`);

      button.innerHTML = `
        <span class="dot"></span>
        <span>
          <span class="ar-name">${loc.name}</span>
          <span class="en-name">${loc.ar}</span>
        </span>
      `;

      button.addEventListener("click", () => {
        activateItem(index);
        map.flyTo([loc.lat, loc.lon], 12, { duration: 0.8 });
        marker.openPopup();
      });

      listItem.appendChild(button);
      locationList.appendChild(listItem);
      itemButtons.push(button);
    });

    if (bounds.isValid()) {
      map.fitBounds(bounds.pad(0.1));
    }

    activateItem(0);
  </script>
</body>
</html>
