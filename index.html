<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خريطة البقاع | Bekaa Valley Map</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    :root {
      --bg: #f8f5ee;
      --paper: #fffdf8;
      --line: #e1d8c4;
      --text: #2f2a1f;
      --muted: #7f735f;
      --accent: #ce6c27;
      --accent-soft: #f5dcc7;
      --sea: #2f7b90;
      --radius: 18px;
      --shadow: 0 14px 34px rgba(101, 70, 33, 0.12);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      font-family: "Tajawal", sans-serif;
      background:
        radial-gradient(1100px 420px at 14% -10%, #f7e8c8 0%, transparent 58%),
        radial-gradient(1000px 500px at 89% 12%, #d7edf2 0%, transparent 62%),
        linear-gradient(140deg, #fbf8f2 0%, #f5efe4 100%);
      animation: fade-in 450ms ease-out;
    }

    .shell {
      width: min(1180px, 96vw);
      margin: 1.2rem auto;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 1rem;
    }

    header {
      background: linear-gradient(130deg, #fffaf0 0%, #f3ede2 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      animation: rise 500ms ease-out;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .badge {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(150deg, #ffd39b 0%, #f1b06f 100%);
      box-shadow: 0 10px 22px rgba(206, 108, 39, 0.26);
      font-size: 1.25rem;
    }

    h1 {
      font-size: clamp(1.15rem, 2.2vw, 1.5rem);
      font-weight: 700;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 0.82rem;
      color: var(--muted);
      font-family: "Tajawal", sans-serif;
      direction: rtl;
      text-align: start;
      margin-top: 0.2rem;
    }

    body.is-english .subtitle {
      font-family: "Space Mono", monospace;
      direction: ltr;
    }

    .lang-toggle {
      position: fixed;
      left: 1rem;
      bottom: 1rem;
      z-index: 1200;
      border: 1px solid #d8ccb5;
      background: linear-gradient(145deg, rgba(255, 253, 248, 0.96) 0%, rgba(244, 236, 223, 0.96) 100%);
      color: #7c5f3f;
      border-radius: 999px;
      padding: 0.34rem 0.8rem;
      font-family: "Tajawal", sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.15;
      min-height: 32px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
      white-space: nowrap;
    }

    .lang-toggle:hover {
      transform: translateY(-1px);
      border-color: #cfa97e;
      box-shadow: 0 6px 14px rgba(152, 109, 70, 0.2);
    }

    .lang-toggle:focus-visible {
      outline: 2px solid #d4894e;
      outline-offset: 2px;
    }

    .pill {
      border: 1px solid #d8ccb5;
      background: #fffbf2;
      color: #8d6a45;
      border-radius: 999px;
      padding: 0.35rem 0.8rem;
      font-family: "Space Mono", monospace;
      font-size: 0.74rem;
      white-space: nowrap;
    }

    main {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1rem;
      min-height: 76vh;
    }

    aside,
    .map-frame {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    aside {
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .aside-head {
      padding: 1rem 1rem 0.55rem;
      border-bottom: 1px solid var(--line);
      font-family: "Tajawal", sans-serif;
      font-size: 0.94rem;
      font-weight: 700;
      color: var(--muted);
      text-align: start;
      letter-spacing: 0;
    }

    body.is-english .aside-head {
      font-family: "Space Mono", monospace;
      font-size: 0.76rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .count {
      margin: 0.9rem 1rem;
      padding: 0.55rem 0.75rem;
      border-radius: 10px;
      border: 1px solid #e6c8ad;
      background: var(--accent-soft);
      color: #8a4d1e;
      font-family: "Space Mono", monospace;
      font-size: 0.78rem;
      direction: ltr;
      text-align: center;
    }

    .location-list {
      list-style: none;
      overflow-y: auto;
      padding: 0.35rem 0;
      scrollbar-width: thin;
      scrollbar-color: #d4cab8 transparent;
    }

    .location-list li {
      border-bottom: 1px solid #f3eee3;
    }

    .location-btn {
      width: 100%;
      border: none;
      text-align: start;
      border-inline-start: 3px solid transparent;
      padding: 0.62rem 0.95rem;
      background: transparent;
      font: inherit;
      color: inherit;
      cursor: pointer;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.65rem;
      align-items: center;
      transition: background-color 180ms ease, transform 180ms ease;
      animation: list-pop 360ms ease both;
    }

    .location-btn:hover {
      background: #fff4e8;
      transform: translateX(-2px);
    }

    body.is-english .location-btn:hover {
      transform: translateX(2px);
    }

    .location-btn.is-active {
      background: #feecd9;
      border-inline-start-color: #cb6a25;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(206, 108, 39, 0.14);
      margin-top: 0.2rem;
    }

    .ar-name {
      display: block;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .en-name {
      display: block;
      font-size: 0.7rem;
      color: var(--muted);
      font-family: "Space Mono", monospace;
      direction: ltr;
      text-align: left;
      margin-top: 0.08rem;
    }

    .map-frame {
      position: relative;
      min-height: 510px;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .custom-pin {
      width: 16px;
      height: 16px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      background: #d16f2a;
      border: 2px solid #fff7eb;
      box-shadow: 0 4px 10px rgba(148, 87, 44, 0.4);
      position: relative;
    }

    .custom-pin::after {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff5e5;
      position: absolute;
      top: 3px;
      left: 3px;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      border: 1px solid #eadcc7;
      box-shadow: 0 14px 30px rgba(127, 98, 66, 0.2);
    }

    .popup-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.15rem;
      text-align: start;
    }

    .popup-sub {
      font-size: 0.75rem;
      color: #6f6658;
      font-family: "Tajawal", sans-serif;
      margin-bottom: 0.15rem;
      text-align: start;
    }

    body.is-english .popup-sub {
      font-family: "Space Mono", monospace;
    }

    .popup-coord {
      font-size: 0.72rem;
      color: #8a7f6f;
      font-family: "Space Mono", monospace;
      direction: ltr;
      text-align: left;
    }

    .leaflet-control-layers {
      border: 1px solid #e7d8be;
      border-radius: 12px;
      box-shadow: 0 8px 18px rgba(128, 95, 58, 0.18);
      overflow: hidden;
    }

    .leaflet-control-layers-expanded {
      padding: 0.55rem 0.7rem;
      background: rgba(255, 251, 242, 0.97);
      color: #5f4a31;
      font-family: "Tajawal", sans-serif;
      font-size: 0.8rem;
      min-width: 145px;
    }

    body.is-english .leaflet-control-layers-expanded {
      font-family: "Space Mono", monospace;
      font-size: 0.72rem;
    }

    .leaflet-control-layers-selector {
      accent-color: #ce6c27;
    }

    .leaflet-control-layers-base label {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      margin-bottom: 0.28rem;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes list-pop {
      from {
        opacity: 0;
        transform: translateX(8px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @media (max-width: 980px) {
      .shell {
        width: 95vw;
      }

      main {
        grid-template-columns: 1fr;
      }

      aside {
        order: 2;
        max-height: 300px;
      }

      .map-frame {
        order: 1;
        min-height: 56vh;
      }
    }

    @media (max-width: 640px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .pill {
        align-self: flex-start;
      }

      .lang-toggle {
        left: 0.75rem;
        bottom: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <button class="lang-toggle" id="lang-toggle" type="button" aria-label="التبديل إلى الإنجليزية">English</button>

  <div class="shell">
    <header>
      <div class="title-wrap">
        <div class="badge" aria-hidden="true">🗺</div>
        <div>
          <h1 id="page-heading">خريطة البقاع</h1>
          <p class="subtitle" id="page-subtitle">لبنان · مواقع تفاعلية في البقاع</p>
        </div>
      </div>
      <div class="pill" id="pill-count">17 موقع</div>
    </header>

    <main>
      <aside>
        <div class="aside-head" id="aside-title">المواقع</div>
        <div class="count" id="side-count">17 مناطق محددة</div>
        <ul class="location-list" id="location-list"></ul>
      </aside>

      <section class="map-frame">
        <div id="map" role="application" aria-label="خريطة البقاع التفاعلية"></div>
      </section>
    </main>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    const LOCATIONS = [
      { nameAr: "تمنين", nameEn: "Tamnine", lat: 33.872, lon: 36.006 },
      { nameAr: "تربل", nameEn: "Tarboul", lat: 33.830, lon: 36.062 },
      { nameAr: "رياق", nameEn: "Riyaq", lat: 33.896, lon: 36.044 },
      { nameAr: "كفرذبد", nameEn: "Kfar Zabad", lat: 33.747, lon: 35.877 },
      { nameAr: "فرزل", nameEn: "Ferzol", lat: 33.837, lon: 35.972 },
      { nameAr: "نيحا", nameEn: "Niha", lat: 33.578, lon: 35.771 },
      { nameAr: "ابلح", nameEn: "Ablah", lat: 33.832, lon: 35.962 },
      { nameAr: "زحلة", nameEn: "Zahle", lat: 33.847, lon: 35.902 },
      { nameAr: "معلقة", nameEn: "Maalaka", lat: 33.855, lon: 35.898 },
      { nameAr: "مجدل عنجر", nameEn: "Majdel Anjar", lat: 33.724, lon: 35.929 },
      { nameAr: "عنجر", nameEn: "Anjar", lat: 33.726, lon: 35.936 },
      { nameAr: "المرج", nameEn: "Al Marj", lat: 33.698, lon: 35.952 },
      { nameAr: "برالياس", nameEn: "Bar Elias", lat: 33.770, lon: 35.873 },
      { nameAr: "قب الياس", nameEn: "Qab Elias", lat: 33.793, lon: 35.842 },
      { nameAr: "منصورة", nameEn: "Mansourieh", lat: 33.754, lon: 35.921 },
      { nameAr: "قرعون", nameEn: "Qaraoun", lat: 33.553, lon: 35.688 },
      { nameAr: "راشيا", nameEn: "Rashaya", lat: 33.500, lon: 35.838 }
    ];

    const UI_TEXT = {
      ar: {
        pageTitle: "خريطة البقاع | لبنان",
        heading: "خريطة البقاع",
        subtitle: "لبنان · مواقع تفاعلية في البقاع",
        asideTitle: "المواقع",
        countLabel: (count) => `${count} منطقة محددة`,
        pillLabel: (count) => `${count} موقع`,
        mapAria: "خريطة البقاع التفاعلية",
        toggleLabel: "English",
        toggleAria: "التبديل إلى الإنجليزية",
        coordinates: "الإحداثيات",
        layers: {
          light: "خريطة فاتحة",
          satellite: "صور الأقمار الصناعية"
        },
        villageButtonAria: (name) => `إظهار ${name} على الخريطة`
      },
      en: {
        pageTitle: "Bekaa Valley Map | Lebanon",
        heading: "Bekaa Valley Map",
        subtitle: "Lebanon · Interactive Bekaa Locations",
        asideTitle: "Locations",
        countLabel: (count) => `${count} selected locations`,
        pillLabel: (count) => `${count} locations`,
        mapAria: "Interactive Bekaa valley map",
        toggleLabel: "العربية",
        toggleAria: "Switch to Arabic",
        coordinates: "Coordinates",
        layers: {
          light: "Light",
          satellite: "Satellite"
        },
        villageButtonAria: (name) => `Show ${name} on the map`
      }
    };

    let currentLang = "ar";
    let activeIndex = 0;
    let layerControl = null;
    let itemButtons = [];

    const pageTitle = document.querySelector("title");
    const heading = document.getElementById("page-heading");
    const subtitle = document.getElementById("page-subtitle");
    const asideTitle = document.getElementById("aside-title");
    const locationList = document.getElementById("location-list");
    const sideCount = document.getElementById("side-count");
    const pillCount = document.getElementById("pill-count");
    const langToggle = document.getElementById("lang-toggle");
    const mapElement = document.getElementById("map");

    function villageName(loc, lang) {
      return lang === "ar" ? loc.nameAr : loc.nameEn;
    }

    function popupHtml(loc, lang) {
      const t = UI_TEXT[lang];
      return `
        <div>
          <div class="popup-title">${villageName(loc, lang)}</div>
          <div class="popup-sub">${t.coordinates}</div>
          <div class="popup-coord">${loc.lat.toFixed(4)}, ${loc.lon.toFixed(4)}</div>
        </div>
      `;
    }

    const map = L.map("map", {
      center: [33.75, 35.90],
      zoom: 10,
      zoomControl: true,
      scrollWheelZoom: true
    });

    const lightLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
      maxZoom: 19
    });

    const satelliteLayer = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        attribution:
          "Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community",
        maxZoom: 19
      }
    );

    lightLayer.addTo(map);

    function renderLayerControl() {
      if (layerControl) {
        layerControl.remove();
      }

      const t = UI_TEXT[currentLang];
      layerControl = L.control.layers(
        {
          [t.layers.light]: lightLayer,
          [t.layers.satellite]: satelliteLayer
        },
        null,
        {
          position: currentLang === "ar" ? "topleft" : "topright",
          collapsed: false
        }
      );
      layerControl.addTo(map);
    }

    const pinIcon = L.divIcon({
      className: "",
      html: '<div class="custom-pin"></div>',
      iconSize: [16, 16],
      iconAnchor: [8, 16],
      popupAnchor: [0, -14]
    });

    const markers = [];
    const bounds = L.latLngBounds();

    function activateItem(index) {
      itemButtons.forEach((button, idx) => {
        button.classList.toggle("is-active", idx === index);
      });
    }

    function refreshMarkerLanguage() {
      markers.forEach((marker, index) => {
        const loc = LOCATIONS[index];
        marker.bindPopup(popupHtml(loc, currentLang));
        marker.bindTooltip(villageName(loc, currentLang));
      });

      if (markers[activeIndex] && markers[activeIndex].isPopupOpen()) {
        markers[activeIndex].openPopup();
      }
    }

    function renderLocationList() {
      const t = UI_TEXT[currentLang];

      locationList.innerHTML = "";
      itemButtons = [];

      LOCATIONS.forEach((loc, index) => {
        const listItem = document.createElement("li");
        const button = document.createElement("button");
        const shownName = villageName(loc, currentLang);

        button.className = "location-btn";
        button.style.animationDelay = `${index * 35}ms`;
        button.type = "button";
        button.setAttribute("aria-label", t.villageButtonAria(shownName));

        button.innerHTML = `
          <span class="dot"></span>
          <span>
            <span class="ar-name">${shownName}</span>
            <span class="en-name">${loc.lat.toFixed(4)}, ${loc.lon.toFixed(4)}</span>
          </span>
        `;

        button.addEventListener("click", () => {
          activeIndex = index;
          activateItem(index);
          map.flyTo([loc.lat, loc.lon], 12, { duration: 0.8 });
          markers[index].openPopup();
        });

        if (index === activeIndex) {
          button.classList.add("is-active");
        }

        listItem.appendChild(button);
        locationList.appendChild(listItem);
        itemButtons.push(button);
      });
    }

    function applyLanguage(lang) {
      currentLang = lang;

      const isEnglish = lang === "en";
      const t = UI_TEXT[lang];

      document.documentElement.lang = lang;
      document.documentElement.dir = isEnglish ? "ltr" : "rtl";
      document.body.classList.toggle("is-english", isEnglish);

      pageTitle.textContent = t.pageTitle;
      heading.textContent = t.heading;
      subtitle.textContent = t.subtitle;
      asideTitle.textContent = t.asideTitle;
      sideCount.textContent = t.countLabel(LOCATIONS.length);
      pillCount.textContent = t.pillLabel(LOCATIONS.length);
      mapElement.setAttribute("aria-label", t.mapAria);
      langToggle.textContent = t.toggleLabel;
      langToggle.setAttribute("aria-label", t.toggleAria);

      renderLayerControl();
      refreshMarkerLanguage();
      renderLocationList();
      activateItem(activeIndex);
    }

    LOCATIONS.forEach((loc, index) => {
      const marker = L.marker([loc.lat, loc.lon], { icon: pinIcon }).addTo(map);

      marker.on("click", () => {
        activeIndex = index;
        activateItem(index);
      });

      markers.push(marker);
      bounds.extend([loc.lat, loc.lon]);
    });

    if (bounds.isValid()) {
      map.fitBounds(bounds.pad(0.1));
    }

    langToggle.addEventListener("click", () => {
      applyLanguage(currentLang === "ar" ? "en" : "ar");
    });

    applyLanguage("ar");
  </script>
</body>
</html>
